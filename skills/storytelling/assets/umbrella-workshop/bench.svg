<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Umbrella repair workbench · 修傘工作檯</title>
  <desc id="desc">A folded blue umbrella rests on the left of a workbench. A spool of ochre thread sits on the right. 示意圖中，折起的藍傘放在工作檯左側，赭黃色線軸在右側。</desc>
  <rect width="640" height="360" rx="12" fill="#f5eee1"/>
  <g fill="none" stroke="#dacdb9" stroke-width="2">
    <path d="M0 46H640 M0 158H640 M0 274H640"/>
    <path d="M30 82h83 m-33 219h96 m236-220h110 m-40 220h72"/>
  </g>
  <!-- A closed canopy, folded along its shaft, with an exposed hook handle. -->
  <g transform="rotate(-18 215 198)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 194h-21 M133 194H85v13c0 24-35 24-35 0v-8"
          fill="none" stroke="#25393d" stroke-width="9"/>
    <path d="M348 194 Q269 176 155 154 Q142 152 138 163
             Q122 162 120 175 Q104 180 112 194 Q105 206 121 215
             Q125 229 140 223 Q148 238 162 230 Q260 216 348 194Z"
          fill="#437483" stroke="#253e49" stroke-width="3"/>
    <g fill="none" stroke="#294d5c" stroke-width="2">
      <path d="M138 163 Q235 181 343 194 M120 175 Q239 190 343 194"/>
      <path d="M113 194 Q249 201 343 194 M121 215 Q229 202 343 194"/>
      <path d="M140 223 Q229 211 343 194"/>
    </g>
    <path d="m195 160 13 3 -9 60 -13 3Z" fill="#cb8754" stroke="#513e37" stroke-width="2"/>
  </g>
  <!-- The thread is wound around the bobbin; its loose end trails right. -->
  <g stroke-linejoin="round">
    <path d="M515 218q20 29 41 6t33 4" fill="none" stroke="#965d27"
          stroke-width="3" stroke-linecap="round"/>
    <path d="M439 147h76v81q-35 12-76 0Z" fill="#a86d35" stroke="#60452f" stroke-width="3"/>
    <ellipse cx="477" cy="225" rx="47" ry="12" fill="#bd9163" stroke="#60452f" stroke-width="3"/>
    <path d="M442 146q35 12 70 0v66q-32 14-70 0Z" fill="#ce933e" stroke="#714c2d" stroke-width="2"/>
    <g fill="none" stroke="#986323" stroke-width="2">
      <path d="M444 156q31 11 66-2 M444 167q31 11 66-2 M444 178q31 11 66-2"/>
      <path d="M444 189q31 11 66-2 M444 200q31 11 66-2"/>
    </g>
    <ellipse cx="477" cy="143" rx="47" ry="12" fill="#d7b58b" stroke="#60452f" stroke-width="3"/>
    <ellipse cx="477" cy="143" rx="9" ry="3.5" fill="#624b3c"/>
  </g>
</svg>
