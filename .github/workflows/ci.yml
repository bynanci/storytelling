name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Format gate
        run: |
          cargo fmt --all
          git diff --exit-code -- '*.rs'
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: SDLC traceability and architecture
        run: python3 scripts/check_repo.py
      - name: Host proof evidence rejection checks (no host invocation)
        run: python3 tests/oracles/filmcraft-25-v1/test_checks.py
      - name: Release-mode arithmetic regression
        run: cargo test --workspace --release --locked
      - name: Frozen OpenFilm export conformance
        run: python3 tests/oracles/openfilm-finite-v1/compare.py target/release/storytelling --output "$RUNNER_TEMP/openfilm-differential.json"
      - name: Pinned Python for official OTIO oracle
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install official OTIO oracle (test-only)
        run: |
          python -m venv "$RUNNER_TEMP/otio-oracle"
          "$RUNNER_TEMP/otio-oracle/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/oracles/otio-finite-v1/requirements-linux-py312.txt
      - name: Official OTIO parse write read and source conformance
        run: '"$RUNNER_TEMP/otio-oracle/bin/python" tests/oracles/otio-finite-v1/verify.py target/release/storytelling --output "$RUNNER_TEMP/otio-differential.json"'
      - name: Frozen StoryBrief hard-constraint policy comparison
        run: python3 tests/oracles/story-brief-v1/compare.py target/release/storytelling --output "$RUNNER_TEMP/story-brief-differential.json"
      - name: Frozen fixed-window planner source comparison
        run: python3 tests/oracles/fixed-window-planner-v1/compare.py target/release/storytelling --output "$RUNNER_TEMP/fixed-window-planner-differential.json"
      - name: Checksum-pinned Node for live planner shadow (test-only)
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 60 https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$RUNNER_TEMP/planner-shadow-node.tar.xz"
          printf '%s  %s\n' '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6' "$RUNNER_TEMP/planner-shadow-node.tar.xz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/planner-shadow-tools"
          tar --extract --xz --file "$RUNNER_TEMP/planner-shadow-node.tar.xz" --directory "$RUNNER_TEMP/planner-shadow-tools" --no-same-owner
          mkdir "$RUNNER_TEMP/planner-shadow-npm"
          cp tests/oracles/openfilm-finite-v1/package.json tests/oracles/openfilm-finite-v1/package-lock.json "$RUNNER_TEMP/planner-shadow-npm/"
          env PATH="$RUNNER_TEMP/planner-shadow-tools/node-v24.22.1-linux-x64/bin:$PATH" "$RUNNER_TEMP/planner-shadow-tools/node-v24.22.1-linux-x64/bin/npm" ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/planner-shadow-npm" --cache "$RUNNER_TEMP/planner-shadow-npm-cache"
      - name: Exact public source for live planner shadow
        run: |
          mkdir "$RUNNER_TEMP/planner-shadow-source"
          git -C "$RUNNER_TEMP/planner-shadow-source" init --quiet
          git -C "$RUNNER_TEMP/planner-shadow-source" -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 fetch --depth=1 --no-tags https://github.com/bynanci/open-film.git 7add4762fe8174d76f43b863375ea39b73121e76
          git -C "$RUNNER_TEMP/planner-shadow-source" -c advice.detachedHead=false checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/planner-shadow-source" rev-parse HEAD)" = 7add4762fe8174d76f43b863375ea39b73121e76
          test -z "$(git -C "$RUNNER_TEMP/planner-shadow-source" status --porcelain)"
      - name: Live shadow checker rejection regressions
        run: >-
          env PLANNER_SHADOW_SOURCE="$RUNNER_TEMP/planner-shadow-source"
          PLANNER_SHADOW_NODE="$RUNNER_TEMP/planner-shadow-tools/node-v24.22.1-linux-x64/bin/node"
          PLANNER_SHADOW_TSX="$RUNNER_TEMP/planner-shadow-npm/node_modules/tsx/dist/loader.mjs"
          python3 -m unittest discover -s tests/oracles/planner-shadow-v1 -p 'test_*.py'
      - name: Live selected-domain source and native planner shadow
        run: >-
          python3 tests/oracles/planner-shadow-v1/run.py
          --source "$RUNNER_TEMP/planner-shadow-source"
          --node "$RUNNER_TEMP/planner-shadow-tools/node-v24.22.1-linux-x64/bin/node"
          --tsx "$RUNNER_TEMP/planner-shadow-npm/node_modules/tsx/dist/loader.mjs"
          --rust-cli "$GITHUB_WORKSPACE/target/release/storytelling"
          --run-root "$RUNNER_TEMP/planner-shadow-evidence"
      - name: Native CLI without external tools on PATH
        run: |
          mkdir "$RUNNER_TEMP/no-media-tools"
          env PATH="$RUNNER_TEMP/no-media-tools" ./target/release/storytelling import-openfilm tests/fixtures/openfilm/finite-v1/still.json
          env PATH="$RUNNER_TEMP/no-media-tools" ./target/release/storytelling export-otio tests/fixtures/openfilm/finite-v1/still.json --metadata-only-locks
          env PATH="$RUNNER_TEMP/no-media-tools" ./target/release/storytelling audit-brief tests/fixtures/brief-v1/valid.json
          env PATH="$RUNNER_TEMP/no-media-tools" ./target/release/storytelling plan-story tests/fixtures/planner-v1/valid.json
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build
        run: cargo build --workspace --locked
      - name: Unit and real CLI integration tests
        run: cargo test --workspace --locked
      - name: Read-only sample
        run: cargo run --locked -p storytelling-cli -- validate examples/minimal-plan.json
      - name: Checkout remains unchanged
        run: git diff --exit-code
  required:
    name: Required gates
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: All lanes must pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
        run: test "$QUALITY" = success && test "$TEST" = success
