name: Bug report
description: Reproducible failure without private media or secrets
title: '[bug] '
body:
  - type: textarea
    id: context
    attributes:
      label: Exact candidate and environment
      description: Give the commit, operating system, toolchain and host versions. Omit private absolute paths.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal synthetic reproduction
      description: List the steps. Describe the expected and actual results. Exclude private footage, tokens and GPS data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and affected requirement
