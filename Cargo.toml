[workspace]
members = ["crates/storytelling-core", "crates/storytelling-engine", "crates/storytelling-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bynanci/storytelling"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
storytelling-core = { path = "crates/storytelling-core" }
storytelling-engine = { path = "crates/storytelling-engine" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
